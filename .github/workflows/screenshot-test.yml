name: Screenshot Tests

# Validates the committed golden images for the app's theme against a fresh
# render of the @Preview screenshot tests. Runs on the BASE theme (no flavor
# applied), so it guards that the theme renders consistently. Regenerate the
# goldens locally with `./gradlew :app:updateDebugScreenshotTest` and commit them.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  screenshot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Validate screenshot tests
        run: ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Upload screenshot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: |
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
