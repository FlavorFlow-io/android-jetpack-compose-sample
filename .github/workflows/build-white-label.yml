
# .github/workflows/build-white-label.yml
name: White-Label Build

on:
  push:
    branches: [ main ]

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.fetch-flavors-action.outputs.flavors }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Fetch flavors
        id: fetch-flavors-action
        uses: FlavorFlow-io/fetch-flavors-action@f143dafe9b0a590a317dfe911d2279464d087ec2
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}

  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors).flavors }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Apply branding
        uses: ./.github/actions/apply-flavor-action
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ toJson(matrix) }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
          
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Run build
        run: ./gradlew build

      # Validate the theme screenshot test against THIS flavor's committed golden.
      # apply-flavor-action rewrote the live Compose theme above; we pick the
      # golden that matches the flavor's app name and copy it into the path the
      # screenshot plugin expects, then validate the fresh render against it.
      - name: Select golden for this flavor
        run: ./scripts/select-screenshot-golden.sh "${{ matrix.app_name }}"

      - name: Validate theme screenshot for this flavor
        run: ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Upload screenshot diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report-${{ matrix.name }}
          path: |
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'