# .github/workflows/build-whitelabel.yml
name: Build Whitelabel Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Job para ler flavors da API
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get_flavors.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Get Flavors from API
        id: get_flavors
        run: |
          # Faz a chamada direta para a API
          FLAVORS_JSON=$(curl -X GET \
            -H "Authorization: Bearer ${{ secrets.FLAVORFLOW_API_KEY }}" \
            -H "Accept: application/json" \
            https://ilesfsxvmvavrlmojmba.supabase.co/functions/v1/project-flavors)
          echo "matrix=$FLAVORS_JSON" >> $GITHUB_OUTPUT

  # 2. Job que roda em matriz, um para cada flavor
  build-app:
    needs: fetch-flavors
    
    strategy:
      fail-fast: false
      # O JSON da API é injetado aqui dinamicamente
      matrix:
        flavor: ${{ fromJson(needs.fetch-flavors.outputs.matrix).flavors }}

    uses: ./.github/workflows/ci.yml
    with:
      flavor_id: ${{ matrix.flavor.id }}
      client_name: ${{ matrix.flavor.name }}
      app_name: ${{ matrix.flavor.app_name }}
      package_name: ${{ matrix.flavor.package_name }}
      primary_color: ${{ matrix.flavor.theme.light.primary }}
      secondary_color: ${{ matrix.flavor.theme.light.secondary }}
      background_color: ${{ matrix.flavor.theme.light.background }}
      logo_url: ${{ matrix.flavor.logo_url }}
    secrets:
      FLAVORFLOW_API_KEY: ${{ secrets.FLAVORFLOW_API_KEY }}
