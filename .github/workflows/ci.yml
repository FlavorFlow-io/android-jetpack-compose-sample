name: Android CI

on:
  workflow_call:
    inputs:
      flavor_id:
        description: 'The flavor identifier'
        required: true
        type: string
      client_name:
        description: 'The client name'
        required: true
        type: string
      app_name:
        description: 'The app name'
        required: true
        type: string
      package_name:
        description: 'The package name'
        required: true
        type: string
      primary_color:
        description: 'Primary brand color'
        required: true
        type: string
      secondary_color:
        description: 'Secondary brand color'
        required: true
        type: string
      tertiary_color:
        description: 'Tertiary brand color'
        required: false
        type: string
      background_color:
        description: 'Background color'
        required: true
        type: string
      surface_color:
        description: 'Surface color'
        required: false
        type: string
      on_primary_color:
        description: 'On primary color'
        required: false
        type: string
      on_secondary_color:
        description: 'On secondary color'
        required: false
        type: string
      on_tertiary_color:
        description: 'On tertiary color'
        required: false
        type: string
      on_background_color:
        description: 'On background color'
        required: false
        type: string
      on_surface_color:
        description: 'On surface color'
        required: false
        type: string
      # Dark theme colors
      dark_primary_color:
        description: 'Dark theme primary color'
        required: false
        type: string
      dark_secondary_color:
        description: 'Dark theme secondary color'
        required: false
        type: string
      dark_tertiary_color:
        description: 'Dark theme tertiary color'
        required: false
        type: string
      dark_background_color:
        description: 'Dark theme background color'
        required: false
        type: string
      dark_surface_color:
        description: 'Dark theme surface color'
        required: false
        type: string
      dark_on_primary_color:
        description: 'Dark theme on primary color'
        required: false
        type: string
      dark_on_secondary_color:
        description: 'Dark theme on secondary color'
        required: false
        type: string
      dark_on_tertiary_color:
        description: 'Dark theme on tertiary color'
        required: false
        type: string
      dark_on_background_color:
        description: 'Dark theme on background color'
        required: false
        type: string
      dark_on_surface_color:
        description: 'Dark theme on surface color'
        required: false
        type: string
      logo_url:
        description: 'Path to the logo file'
        required: true
        type: string
    secrets:
      FLAVORFLOW_API_KEY:
        description: 'FlavorFlow API key'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'jetbrains'
        java-version: '21'

    - name: Fetch Logo
      id: fetch_logo
      if: ${{ inputs.flavor_id != '' }}
      run: |
        chmod +x ./scripts/fetch_logo.sh
        # Try to download logo, but don't fail if it doesn't exist
        LOGO_PATH=$(./scripts/fetch_logo.sh "${{ inputs.flavor_id }}" "${{ secrets.FLAVORFLOW_API_KEY }}" logo --quiet 2>/dev/null || echo "")
        if [ -n "$LOGO_PATH" ] && [ -f "$LOGO_PATH" ]; then
          echo "logo_path=$LOGO_PATH" >> $GITHUB_OUTPUT
          echo "Downloaded logo to: $LOGO_PATH"
        else
          echo "logo_path=" >> $GITHUB_OUTPUT
          echo "No logo available for this flavor"
        fi
      env:
        FLAVORFLOW_API_KEY: ${{ secrets.FLAVORFLOW_API_KEY }}

    - name: Apply Flavor Configuration
      if: ${{ inputs.flavor_id != '' }}
      run: |
        echo "Applying configuration for flavor: ${{ inputs.flavor_id }}"
        echo "Client: ${{ inputs.client_name }}"
        echo "App Name: ${{ inputs.app_name }}"
        echo "Package: ${{ inputs.package_name }}"
        echo "Primary Color: ${{ inputs.primary_color }}"
        echo "Secondary Color: ${{ inputs.secondary_color }}"
        echo "Tertiary Color: ${{ inputs.tertiary_color }}"
        echo "Background Color: ${{ inputs.background_color }}"
        echo "Surface Color: ${{ inputs.surface_color }}"
        echo "On Primary: ${{ inputs.on_primary_color }}"
        echo "On Secondary: ${{ inputs.on_secondary_color }}"
        echo "On Tertiary: ${{ inputs.on_tertiary_color }}"
        echo "On Background: ${{ inputs.on_background_color }}"
        echo "Dark Primary: ${{ inputs.dark_primary_color }}"
        echo "Dark Secondary: ${{ inputs.dark_secondary_color }}"
        echo "Dark Tertiary: ${{ inputs.dark_tertiary_color }}"
        echo "Dark Background: ${{ inputs.dark_background_color }}"
        echo "Dark Surface: ${{ inputs.dark_surface_color }}"
        echo "Dark On Primary: ${{ inputs.dark_on_primary_color }}"
        echo "Dark On Secondary: ${{ inputs.dark_on_secondary_color }}"
        echo "Dark On Tertiary: ${{ inputs.dark_on_tertiary_color }}"
        echo "Dark On Background: ${{ inputs.dark_on_background_color }}"
        echo "Dark On Surface: ${{ inputs.dark_on_surface_color }}"
        
        LOGO_PATH="${{ steps.fetch_logo.outputs.logo_path }}"
        if [ -n "$LOGO_PATH" ]; then
          echo "Downloaded Logo Path: $LOGO_PATH"
        else
          echo "No logo available for this flavor"
        fi
        
        # Create flavor configuration file using Python for proper JSON handling
        python3 << 'EOF'
        import json
        import os
        
        def add_if_not_empty(obj, key, value):
            """Add key-value pair to object only if value is not empty"""
            if value and value.strip():
                obj[key] = value.strip()
        
        # Build the configuration object
        config = {
            "id": "${{ inputs.flavor_id }}",
            "clientName": "${{ inputs.client_name }}",
            "appName": "${{ inputs.app_name }}",
            "packageName": "${{ inputs.package_name }}",
            "branding": {}
        }
        
        # Build light theme
        light_theme = {}
        add_if_not_empty(light_theme, "primaryColor", "${{ inputs.primary_color }}")
        add_if_not_empty(light_theme, "onPrimaryColor", "${{ inputs.on_primary_color }}")
        add_if_not_empty(light_theme, "secondaryColor", "${{ inputs.secondary_color }}")
        add_if_not_empty(light_theme, "onSecondaryColor", "${{ inputs.on_secondary_color }}")
        add_if_not_empty(light_theme, "tertiaryColor", "${{ inputs.tertiary_color }}")
        add_if_not_empty(light_theme, "onTertiaryColor", "${{ inputs.on_tertiary_color }}")
        add_if_not_empty(light_theme, "backgroundColor", "${{ inputs.background_color }}")
        add_if_not_empty(light_theme, "onBackgroundColor", "${{ inputs.on_background_color }}")
        add_if_not_empty(light_theme, "surfaceColor", "${{ inputs.surface_color }}")
        add_if_not_empty(light_theme, "onSurfaceColor", "${{ inputs.on_surface_color }}")
        
        # Add light theme only if it has any properties
        if light_theme:
            config["branding"]["lightTheme"] = light_theme
        
        # Build dark theme
        dark_theme = {}
        add_if_not_empty(dark_theme, "primaryColor", "${{ inputs.dark_primary_color }}")
        add_if_not_empty(dark_theme, "onPrimaryColor", "${{ inputs.dark_on_primary_color }}")
        add_if_not_empty(dark_theme, "secondaryColor", "${{ inputs.dark_secondary_color }}")
        add_if_not_empty(dark_theme, "onSecondaryColor", "${{ inputs.dark_on_secondary_color }}")
        add_if_not_empty(dark_theme, "tertiaryColor", "${{ inputs.dark_tertiary_color }}")
        add_if_not_empty(dark_theme, "onTertiaryColor", "${{ inputs.dark_on_tertiary_color }}")
        add_if_not_empty(dark_theme, "backgroundColor", "${{ inputs.dark_background_color }}")
        add_if_not_empty(dark_theme, "onBackgroundColor", "${{ inputs.dark_on_background_color }}")
        add_if_not_empty(dark_theme, "surfaceColor", "${{ inputs.dark_surface_color }}")
        add_if_not_empty(dark_theme, "onSurfaceColor", "${{ inputs.dark_on_surface_color }}")
        
        # Add dark theme only if it has any properties
        if dark_theme:
            config["branding"]["darkTheme"] = dark_theme
        
        # Add logo path if available
        logo_path = "${{ steps.fetch_logo.outputs.logo_path }}"
        if logo_path and logo_path.strip():
            config["branding"]["logoPath"] = logo_path.strip()
        
        # Write the JSON file
        with open("flavor_config.json", "w") as f:
            json.dump(config, f, indent=2)
        
        print("Generated flavor_config.json:")
        print(json.dumps(config, indent=2))
        EOF

    - name: Setup Python
      if: ${{ inputs.flavor_id != '' }}
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Apply Branding
      if: ${{ inputs.flavor_id != '' }}
      run: |
        python -m pip install -r scripts/requirements.txt
        # Make the Python script executable
        chmod +x scripts/apply-branding.py
        
        # Run the Python branding script
        python scripts/apply-branding.py

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run build
      run: ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.flavor_id != '' && format('app-{0}', inputs.flavor_id) || 'app' }}
        path: '**/outputs/**/*.apk'
        retention-days: 30

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.flavor_id != '' && format('build-reports-{0}', inputs.flavor_id) || 'build-reports' }}
        path: '**/build/reports/'
        retention-days: 7
