name: Android CI

on:
  workflow_call:
    inputs:
      flavor_id:
        description: 'The flavor slug identifier'
        required: true
        type: string
      client_name:
        description: 'The client name'
        required: true
        type: string
      app_name:
        description: 'The app name'
        required: true
        type: string
      package_name:
        description: 'The package name'
        required: true
        type: string
      primary_color:
        description: 'Primary brand color'
        required: true
        type: string
      secondary_color:
        description: 'Secondary brand color'
        required: true
        type: string
      background_color:
        description: 'Background color'
        required: true
        type: string
      logo_url:
        description: 'Path to the logo file'
        required: true
        type: string
    secrets:
      FLAVORFLOW_API_KEY:
        description: 'FlavorFlow API key'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'jetbrains'
        java-version: '21'

    - name: Fetch Logo
      id: fetch_logo
      if: ${{ inputs.flavor_id != '' }}
      run: |
        chmod +x ./scripts/fetch_logo.sh
        LOGO_PATH=$(./scripts/fetch_logo.sh "${{ inputs.flavor_id }}" "${{ secrets.FLAVORFLOW_API_KEY }}" logo --quiet)
        echo "logo_path=$LOGO_PATH" >> $GITHUB_OUTPUT
        echo "Downloaded logo to: $LOGO_PATH"
      env:
        FLAVORFLOW_API_KEY: ${{ secrets.FLAVORFLOW_API_KEY }}

    - name: Apply Flavor Configuration
      if: ${{ inputs.flavor_id != '' }}
      run: |
        echo "Applying configuration for flavor: ${{ inputs.flavor_id }}"
        echo "Client: ${{ inputs.client_name }}"
        echo "App Name: ${{ inputs.app_name }}"
        echo "Package: ${{ inputs.package_name }}"
        echo "Primary Color: ${{ inputs.primary_color }}"
        echo "Secondary Color: ${{ inputs.secondary_color }}"
        echo "Background Color: ${{ inputs.background_color }}"
        echo "Downloaded Logo Path: ${{ steps.fetch_logo.outputs.logo_path }}"
        
        # Create flavor configuration file
        cat > flavor_config.json << EOF
        {
          "slug": "${{ inputs.flavor_id }}",
          "clientName": "${{ inputs.client_name }}",
          "appName": "${{ inputs.app_name }}",
          "packageName": "${{ inputs.package_name }}",
          "branding": {
            "primaryColor": "${{ inputs.primary_color }}",
            "secondaryColor": "${{ inputs.secondary_color }}",
            "backgroundColor": "${{ inputs.background_color }}",
            "logoUrl": "${{ steps.fetch_logo.outputs.logo_path }}"
          }
        }
        EOF

    - name: Setup Python
      if: ${{ inputs.flavor_id != '' }}
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Apply Branding
      if: ${{ inputs.flavor_id != '' }}
      run: |
        python -m pip install -r scripts/requirements.txt
        # Make the Python script executable
        chmod +x scripts/apply-branding.py
        
        # Run the Python branding script
        python scripts/apply-branding.py

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Test Report
      uses: dorny/test-reporter@v2.1.1      
      if: success() || failure()
      with:
        name: JUnit Tests
        path: '**/TEST-*.xml'
        reporter: 'java-junit'

    - name: Run build
      run: ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.flavor_id != '' && format('app-{0}', inputs.flavor_id) || 'app' }}
        path: '**/outputs/**/*.apk'
        retention-days: 30

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.flavor_id != '' && format('build-reports-{0}', inputs.flavor_id) || 'build-reports' }}
        path: '**/build/reports/'
        retention-days: 7
